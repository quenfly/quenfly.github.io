<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="{{ site.description }}">
  <meta name="keywords" content="{{ site.site-keywords }}">
  <title>{{ site.data.profile.name }}{% if site.data.profile.name_cn %} ({{ site.data.profile.name_cn }}){% endif %} — {{ site.data.profile.title }}</title>
  <meta property="og:title" content="{{ site.data.profile.name }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  {% if site.favicon-url %}
  <link rel="shortcut icon" href="{{ site.favicon-url }}" type="image/x-icon">
  {% endif %}
</head>
