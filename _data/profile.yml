about: |
  I am a Ph.D. candidate in the Department of Real Estate and Construction at The University of Hong Kong, supervised by [Prof. Fan Xue](https://frankxue.com/). I received my M.Eng. in Civil Engineering from Zhejiang University, where I was advised by [Prof. Bate Bate](https://person.zju.edu.cn/en/bate), and my B.Eng. in Geological Engineering from Jilin University.

  My research focuses on digital twins for built assets, ground-penetrating radar (GPR) to 3D reconstruction, explainable AI for engineering simulation, and spatial intelligence in construction. I work at the intersection of geotechnical simulation, computer vision, and intelligent construction management.

